[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "otc-mcp"
version = "0.1.0"
description = "MCP tool server for the OTC Care Assistant: FDA label RAG, drug normalization, FHIR patient profiles and label-based safety checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Production embeddings (small ONNX model, no PyTorch). Tests use the offline hashing embedder.
embed = ["fastembed>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
otc-ingest = "otc_mcp.ingest:main"
otc-build-index = "otc_mcp.build_index:main"
otc-mcp-server = "otc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/otc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
